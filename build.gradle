buildscript {
    ext {
        jooqVersion = '3.19.5'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'nu.studer.jooq' version '9.0'
}

group = 'me.thinking_gorilla'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "src/generated"]
        }
    }
}

dependencies {
    implementation "org.jooq:jooq:${jooqVersion}"

    // https://github.com/etiennestuder/gradle-jooq-plugin
    // jOOQ code generation tool will introspect to the jooqGenerator configuration.
    // This ensures that the database driver is on the classpath when the jOOQ code generation tool is executed.
    jooqGenerator project(':jooq-custom')
    jooqGenerator "org.jooq:jooq:${jooqVersion}"
    jooqGenerator "org.jooq:jooq-meta:${jooqVersion}"

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.data:spring-data-commons'
    implementation ('org.springframework.boot:spring-boot-starter-jooq') {
        exclude group: 'org.jooq'
    }

    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    jooqGenerator project(':entity')
    jooqGenerator "org.jooq:jooq-meta-extensions-hibernate:${jooqVersion}"
    // in-memory H2로 JOOQ dsl 생성을 위함
    // h2의 v2 버전 호환성 때문에 상위버전 대신 1.4.200 버전을 추천
    jooqGenerator 'com.h2database:h2:1.4.200'
}

tasks.named('test') {
    useJUnitPlatform()
}

jooq {
    version = "${jooqVersion}"
    configurations {
        sakilaDB {
            generationTool {
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.extensions.jpa.JPADatabase'
                        // jOOQ에서 제공하는 unsinged type 사용여부
                        unsignedTypes = true

                        properties {
                            property {
                                key = 'packages'
                                value = 'me.thinking_gorilla'
                            }

                            // 2순위
                            // DSL 생성시, jpa의 AttributeConverters 에 따라 jooq DSL의 타입을 매핑할지 여부
                            property {
                                key = 'useAttributeConverters'
                                value = true
                            }
                        }

                        // 1순위
                        forcedTypes {
                            forcedType {
                                includeTypes = 'int unsigned'
                                userType = 'java.lang.Long'
                            }
                            forcedType {
                                includeTypes = 'tinyint unsigned'
                                userType = 'java.lang.Integer'
                            }
                            forcedType {
                                includeTypes = 'smallint unsigned'
                                userType = 'java.lang.Integer'
                            }
                        }
                    }
                    generate {
                        // DSL 생성 시 일부 편의 기능이 완성된 Dao 자동생성
                        daos = true
                        // DB 테이블에 대응되는 ActiveRecord 자동생성
                        records = true
                        // DB 테이블에 대응되는 pojo 자동생성
                        // pojos = true
                        immutablePojos = false
                        // pojo나 record 생성 시 return 값이 void 대신 객체 자체를 반환
                        fluentSetters = true
                        // java.sql.[Date|Time|Timestamp] 대신 java.time[LocalDate|LocalTime|LocalDateTime] 반환
                        javaTimeTypes = true
                        deprecated = false
                        // 특정 데이터 타입을 DSL에서 강제로 다른 타입으로 지정 (e.g. INET, JSON → varchar)
                        // forceTypes = true

                        // jOOQ로 JPA 어노테이션이 붙은 모델을 생성함
                        // jpaAnnotations = true
                        // jpaVersion = 2.2

                        //  javax.validation(JSR-380) 어노테이션이 붙은 모델을 생성함
                        // validationAnnotations = true

                        // Spring DATA Porject에 맞춰 모델을 생성함
                        // springAnnotations = true
                        // springDao = true
                    }
                    target {
                        directory = 'src/generated'
                    }

                    // 왜 따로 서브모듈로 분리해야할까?
                    strategy.name = 'jooq.custom.generator.JPrefixGeneratorStrategy'
                }
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java', 'src/generated']
            }
        }
    }
}
